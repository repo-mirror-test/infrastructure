name: Ascend GitCode repos mirror periodic job

on:
  pull_request:
    paths:
    - '.github/workflows/**'
    # Runs at every pull submitted in master branch 
    branches: [main]
  schedule:
    - cron:  '0 1 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - name: Get repository list exclude private and fork
      id: repo
      uses: yi-Xu-0100/repo-list-generator@v1.0.1
    - name: Mirror the gitcode/ascend org repos to github/repo-mirror-test.
      uses: Yikun/hub-mirror-action@master
      with:
        src: gitcode/ascend
        dst: github/repo-mirror-test
        dst_key: ${{ secrets.SYNC_KEY_ZYK }}
        dst_token:  ${{ secrets.SYNC_TOKEN_ZYK }}
        account_type: org
        clone_style: ssh 
        force_update: true
        static_list: ${{ steps.repo.outputs.repoList }}
        debug: true
        lfs: true